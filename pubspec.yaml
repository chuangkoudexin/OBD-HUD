name: obd_hud
description: "OBD HUD - 蓝牙 OBD2 车载抬头显示仪表盘 (Flutter)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 经典蓝牙 SPP (ELM327 老式蓝牙适配器)
  flutter_bluetooth_serial: ^0.4.0
  # BLE OBD2 适配器 (如 V-Link / KW902)
  flutter_blue_plus: ^1.36.8
  # 状态管理
  provider: ^6.1.5+1
  # 配置持久化
  shared_preferences: ^2.5.3
  # 运行时蓝牙权限申请
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
